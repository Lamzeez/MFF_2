name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:client-bundle
      - run: npx expo export --platform all --output-dir dist/app-check --max-workers 2
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Fresh runner: this starts a disposable local DB and applies migrations.
      # Never links, pushes to, or resets a hosted project.
      - run: npm run db:start
      - run: npm run db:lint
      - run: npm run db:test
      - run: npm run db:types:check
      - if: always()
        run: npx supabase stop
