<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mati FoodFinder — UX Flow Prototype</title>
<style>
/* ============================================================
   MATI FOODFINDER — DESIGN SYSTEM
   8pt spacing grid · one primary action per view · tokens first
   ============================================================ */
:root{
  --brand:#EA5410; --brand-600:#D44808; --brand-50:#FEF1E8; --brand-100:#FCE0CE;
  --ink:#17191D; --ink-2:#4B5563; --ink-3:#98A2B3;
  --line:#E7EAEF; --line-2:#F0F2F5;
  --bg:#F4F5F7; --card:#FFFFFF;
  --green:#0E9F6E; --green-50:#E7F7F0;
  --amber:#D97706; --amber-50:#FDF3E1;
  --red:#E02424;  --red-50:#FDECEC;
  --blue:#1C64F2; --blue-50:#EBF1FE;
  --violet:#7C3AED; --violet-50:#F1EBFE;
  --r-xl:20px; --r-lg:16px; --r-md:12px; --r-sm:8px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);
  --shadow-md:0 4px 12px -2px rgba(16,24,40,.10),0 2px 4px -2px rgba(16,24,40,.06);
  --shadow-lg:0 16px 40px -12px rgba(16,24,40,.25);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{height:100%}
body{font-family:var(--font);background:#E9ECF1;color:var(--ink);font-size:14px;line-height:1.45;display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#CBD2DB;border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Typography ---------- */
.h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
.h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.h3{font-size:15px;font-weight:700}
.tiny{font-size:11px}
.small{font-size:12.5px}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.bold{font-weight:700}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Prototype chrome ---------- */
.topbar{height:58px;background:#111318;color:#fff;display:flex;align-items:center;gap:16px;padding:0 18px;flex-shrink:0;z-index:50}
.topbar .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.topbar .logo .mark{width:30px;height:30px;border-radius:9px;background:var(--brand);display:grid;place-items:center;font-size:16px}
.proto-tag{font-size:10px;font-weight:700;letter-spacing:.08em;background:#2A2E37;color:#A7B0BE;padding:3px 8px;border-radius:99px;text-transform:uppercase}
.role-switch{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.role-btn{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:99px;font-size:12.5px;font-weight:600;color:#B9C0CC;background:#1E2129;border:1px solid #2E3340;transition:all .15s}
.role-btn:hover{color:#fff;border-color:#4A5160}
.role-btn.active{background:var(--brand);border-color:var(--brand);color:#fff}
.role-btn .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.6}
.device-switch{display:flex;background:#1E2129;border:1px solid #2E3340;border-radius:99px;padding:3px;gap:2px}
.device-btn{padding:5px 12px;border-radius:99px;font-size:12px;font-weight:600;color:#B9C0CC}
.device-btn.active{background:#3A3F4C;color:#fff}

.stage{flex:1;display:flex;min-height:0}
.guide{width:292px;background:#fff;border-right:1px solid var(--line);padding:22px 20px;overflow-y:auto;flex-shrink:0}
.guide .role-eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);margin-bottom:6px}
.guide h1{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.guide .platform{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;background:var(--line-2);color:var(--ink-2);padding:3px 9px;border-radius:99px;margin:6px 0 14px}
.guide p.desc{font-size:13px;color:var(--ink-2);margin-bottom:18px;line-height:1.55}
.guide .try-title{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.guide ol.try{list-style:none;counter-reset:step;display:flex;flex-direction:column;gap:9px;margin-bottom:20px}
.guide ol.try li{counter-increment:step;display:flex;gap:10px;font-size:12.5px;color:var(--ink-2);line-height:1.45}
.guide ol.try li::before{content:counter(step);flex-shrink:0;width:20px;height:20px;border-radius:50%;background:var(--brand-50);color:var(--brand);font-size:11px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.guide .note{background:var(--amber-50);border:1px solid #F3DFB7;border-radius:var(--r-md);padding:11px 12px;font-size:12px;color:#7C5410;line-height:1.5}
.guide .note b{color:#6B4A0E}
.frame-host{flex:1;display:flex;padding:26px;min-width:0;overflow:auto}
.frame-host>*{margin:auto}

/* ---------- Phone frame ---------- */
.phone{width:390px;height:800px;background:#0B0C0E;border-radius:46px;padding:11px;box-shadow:var(--shadow-lg),0 0 0 2px #2A2D33;flex-shrink:0;position:relative}
.phone-inner{width:100%;height:100%;background:var(--bg);border-radius:36px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.statusbar{height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 28px;font-size:12.5px;font-weight:700;background:var(--bg);position:relative;z-index:5}
.statusbar .sicons{display:flex;gap:5px;align-items:center;color:var(--ink)}
.notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:110px;height:26px;background:#0B0C0E;border-radius:0 0 16px 16px;z-index:60}
.screen{flex:1;overflow-y:auto;overscroll-behavior:contain;position:relative;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.page{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;animation:slideIn .22s ease-out}
.page .page-body{flex:1;overflow-y:auto;scrollbar-width:none}
.page .page-body::-webkit-scrollbar{display:none}
@keyframes slideIn{from{transform:translateX(28px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fadeUp{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}

/* ---------- Mobile app bars & tabs ---------- */
.appbar{padding:10px 18px 12px;display:flex;align-items:center;gap:12px;background:var(--bg)}
.appbar .title{flex:1;min-width:0}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2);flex-shrink:0;position:relative;box-shadow:var(--shadow-sm)}
.iconbtn:active{transform:scale(.94)}
.iconbtn .ndot{position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;border-radius:99px;background:var(--red);color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.tabbar{flex-shrink:0;height:64px;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:15;position:relative}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font-size:10px;font-weight:600;position:relative}
.tab.active{color:var(--brand)}
.tab .badge{position:absolute;top:6px;left:calc(50% + 2px);min-width:16px;height:16px;border-radius:99px;background:var(--red);color:#fff;font-size:9px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.tab:active{opacity:.7}

/* ---------- Components ---------- */
.card{background:var(--card);border-radius:var(--r-lg);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:13.5px;border-radius:var(--r-md);padding:11px 18px;transition:transform .08s,opacity .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-600)}
.btn.dark{background:var(--ink);color:#fff}
.btn.soft{background:var(--brand-50);color:var(--brand)}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--red-50);color:var(--red)}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:10px}
.btn.lg{padding:14px 20px;font-size:15px;border-radius:14px}
.btn:disabled{opacity:.45;pointer-events:none}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 4px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.badge.green{background:var(--green-50);color:var(--green)}
.badge.amber{background:var(--amber-50);color:var(--amber)}
.badge.red{background:var(--red-50);color:var(--red)}
.badge.blue{background:var(--blue-50);color:var(--blue)}
.badge.gray{background:var(--line-2);color:var(--ink-2)}
.badge.violet{background:var(--violet-50);color:var(--violet)}
.input{width:100%;padding:11px 14px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--card);font-size:13.5px;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--brand)}
.label{font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:6px;display:block}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column}
.divider{height:1px;background:var(--line-2);border:none}
.food-thumb{border-radius:var(--r-md);display:grid;place-items:center;flex-shrink:0;position:relative;overflow:hidden}
.rest-card{background:var(--card);border-radius:var(--r-lg);border:1px solid var(--line);overflow:hidden;box-shadow:var(--shadow-sm);transition:transform .12s,box-shadow .12s}
.rest-card:active{transform:scale(.985)}
.rating{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:700}
.avatar{border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex-shrink:0}
.qty{display:inline-flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:99px;overflow:hidden;background:var(--card)}
.qty button{width:30px;height:30px;display:grid;place-items:center;color:var(--brand);font-weight:800}
.qty span{min-width:26px;text-align:center;font-weight:800;font-size:13px}
.switch{width:44px;height:26px;border-radius:99px;background:#D4D9E0;position:relative;transition:background .2s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(18px)}
.listrow{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--card)}
.listrow:active{background:var(--line-2)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;text-align:center;gap:6px}
.empty .eicon{width:64px;height:64px;border-radius:50%;background:var(--line-2);display:grid;place-items:center;font-size:26px;margin-bottom:8px}
.progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.progress>div{height:100%;border-radius:99px;background:var(--brand)}
.stepper{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px}
.step .rail{display:flex;flex-direction:column;align-items:center;width:22px;flex-shrink:0}
.step .sdot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;color:transparent;font-size:11px;flex-shrink:0}
.step.done .sdot{background:var(--green);border-color:var(--green);color:#fff}
.step.now .sdot{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 4px var(--brand-50)}
.step .sline{width:2px;flex:1;min-height:26px;background:var(--line)}
.step.done .sline{background:var(--green)}
.step .sbody{padding-bottom:22px;flex:1;min-width:0}
.section-pad{padding:14px 18px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;padding:18px 18px 10px}
.searchbar{margin:0 18px;display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px;color:var(--ink-3);box-shadow:var(--shadow-sm)}
.searchbar input{border:none;outline:none;background:none;flex:1;font-size:13.5px;color:var(--ink)}
.mapview{position:relative;flex:1;overflow:hidden;background:#E4EAE0}
.map-grid{position:absolute;inset:0;background-image:linear-gradient(#D5DCD0 1px,transparent 1px),linear-gradient(90deg,#D5DCD0 1px,transparent 1px);background-size:44px 44px}
.map-road{position:absolute;background:#fff;box-shadow:0 0 0 1px #D8DED2}
.map-pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;cursor:pointer;z-index:3}
.map-pin .pin-bubble{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:5px 9px;font-size:11px;font-weight:700;box-shadow:var(--shadow-md);white-space:nowrap;display:flex;align-items:center;gap:5px}
.map-pin .pin-tri{width:10px;height:10px;background:var(--card);border-right:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:rotate(45deg) translateY(-7px)}
.map-pin.sel .pin-bubble{background:var(--ink);color:#fff;border-color:var(--ink)}
.map-pin.sel .pin-tri{background:var(--ink);border-color:var(--ink)}
.fab{position:absolute;bottom:18px;right:16px;z-index:8;display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;padding:13px 18px;border-radius:99px;font-weight:700;font-size:13px;box-shadow:var(--shadow-lg)}
.fab:active{transform:scale(.96)}
.fab .count{background:var(--brand);border-radius:99px;min-width:20px;height:20px;display:grid;place-items:center;font-size:11px;font-weight:800}

/* ---------- Sheets & modals ---------- */
.scrim{position:absolute;inset:0;background:rgba(15,18,24,.5);z-index:40;animation:fadeIn .18s;display:flex;align-items:flex-end;justify-content:center}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:10px 20px 26px;animation:sheetUp .25s cubic-bezier(.32,.72,.35,1);max-height:82%;overflow-y:auto;scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
@keyframes sheetUp{from{transform:translateY(60px);opacity:.5}to{transform:none;opacity:1}}
.sheet .grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:4px auto 16px}
.web-scrim{position:fixed;inset:0;background:rgba(15,18,24,.5);z-index:200;display:flex;align-items:center;justify-content:center;animation:fadeIn .18s}
.web-modal{background:#fff;border-radius:var(--r-xl);width:440px;max-width:92%;max-height:84%;overflow-y:auto;padding:26px;box-shadow:var(--shadow-lg);animation:fadeUp .22s}

/* ---------- Toast ---------- */
.toast{position:absolute;top:52px;left:50%;transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:10px 16px;border-radius:99px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;animation:toastIn .25s;white-space:nowrap;max-width:90%}
@keyframes toastIn{from{transform:translate(-50%,-10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* ---------- Browser frame / web app ---------- */
.browser{width:min(1220px,100%);height:800px;background:#fff;border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;display:flex;flex-direction:column;flex-shrink:0}
.browser-bar{height:42px;background:#EFF1F5;display:flex;align-items:center;gap:12px;padding:0 14px;flex-shrink:0;border-bottom:1px solid var(--line)}
.browser-dots{display:flex;gap:6px}
.browser-dots i{width:11px;height:11px;border-radius:50%;display:block}
.browser-url{flex:1;max-width:460px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 14px;font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.webapp{flex:1;display:flex;min-height:0}
.sidebar{width:222px;background:#fff;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;flex-shrink:0;overflow-y:auto}
.side-brand{display:flex;align-items:center;gap:9px;padding:6px 10px 16px;font-weight:800;font-size:14.5px}
.side-brand .mark{width:28px;height:28px;border-radius:8px;background:var(--brand);display:grid;place-items:center;font-size:14px;color:#fff}
.side-label{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:12px 12px 6px}
.side-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink-2);transition:background .12s}
.side-item:hover{background:var(--line-2)}
.side-item.active{background:var(--brand-50);color:var(--brand)}
.side-item .cnt{margin-left:auto;font-size:10.5px;font-weight:800;background:var(--red);color:#fff;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.webmain{flex:1;overflow-y:auto;background:var(--bg);padding:26px 30px;min-width:0}
.web-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:14px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow-sm)}
.kpi .k-label{font-size:11.5px;font-weight:600;color:var(--ink-3);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.kpi .k-val{font-size:24px;font-weight:800;letter-spacing:-.02em}
.kpi .k-delta{font-size:11px;font-weight:700;margin-top:4px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);overflow:hidden}
.panel .p-head{padding:15px 20px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel .p-body{padding:16px 20px}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);padding:10px 20px;border-bottom:1px solid var(--line);background:#FAFBFC}
.table td{padding:12px 20px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.table tr:last-child td{border-bottom:none}
.table tr:hover td{background:#FAFBFC}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding:10px 4px 0}
.bars .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars .bar i{width:70%;max-width:34px;border-radius:6px 6px 0 0;background:var(--brand);display:block;transition:height .3s}
.bars .bar span{font-size:10.5px;color:var(--ink-3);font-weight:600}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink-2);font-weight:600}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}

/* ---------- Feed ---------- */
.post{background:var(--card);border-bottom:1px solid var(--line);padding:14px 18px}
.post .p-photo{border-radius:var(--r-lg);height:170px;display:grid;place-items:center;font-size:56px;margin:10px 0;position:relative}
.post .p-actions{display:flex;gap:18px;padding-top:10px}
.p-act{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.p-act.liked{color:var(--red)}

/* ---------- Responsive scaling of frames ---------- */
@media (max-height:940px){.phone{transform:scale(.9)} .browser{transform:scale(.92)}}
@media (max-height:840px){.phone{transform:scale(.8)} .browser{transform:scale(.82)}}
@media (max-width:900px){.guide{display:none}}
@media (max-width:520px){.phone{transform:scale(.82)}}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo"><span class="mark">🍜</span> Mati FoodFinder <span class="proto-tag">Flow Prototype</span></div>
  <div class="device-switch" id="deviceSwitch" style="display:none">
    <button class="device-btn active" id="devApp" onclick="A.setDevice('app')">📱 Merchant App</button>
    <button class="device-btn" id="devWeb" onclick="A.setDevice('web')">🖥️ Web Portal</button>
  </div>
  <nav class="role-switch" id="roleSwitch"></nav>
</header>

<div class="stage">

function searchResults(){
  const q=S.search.trim().toLowerCase();
  if(!q) return '<div class="section-pad"><div class="tiny dim bold" style="letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px">Popular searches</div>'
    +'<div class="row" style="gap:8px;flex-wrap:wrap">'+['humba','tuna','isaw','halo-halo','kinilaw','inasal'].map(t=>'<button class="chip" onclick="A.doSearch(\''+t+'\')">'+t+'</button>').join('')+'</div></div>';
  const dm=DISHES.filter(d=>d.name.toLowerCase().includes(q));
  const rm=RESTAURANTS.filter(r=>r.name.toLowerCase().includes(q)||r.cat.toLowerCase().includes(q));
  let h='';
  if(rm.length) h+='<div class="sec-head" style="padding-top:6px"><span class="h3">Restaurants</span></div>'+rm.map(restCard).join('');
  if(dm.length) h+='<div class="sec-head"><span class="h3">Dishes</span></div>'+dm.map(d=>{
      const r=rest(d.rid);
      return '<div class="row card" style="padding:12px;margin:0 18px 10px" onclick="A.openRest('+d.rid+')">'
      +'<div class="food-thumb" style="width:46px;height:46px;font-size:22px;background:var(--line-2)">'+d.emoji+'</div>'
      +'<div style="flex:1;min-width:0"><div class="bold ellipsis" style="font-size:13px">'+d.name+'</div><div class="tiny dim">'+r.name+'</div></div>'
      +'<span class="bold" style="color:var(--brand)">'+peso(d.price)+'</span></div>';}).join('');
  if(!h) h='<div class="empty"><div class="eicon">🔍</div><div class="h3">No results for “'+S.search+'”</div><div class="small muted">Try another dish or restaurant.</div></div>';
  return h;
}

      +'<label class="label">Rating</label><div class="row" style="gap:6px;margin-bottom:16px" id="npStars">'

      +'<button class="btn primary block lg" onclick="A.doPost()">Post to feed</button>',

    comments:(pid)=>{
      const p=S.feed.find(x=>x.id===pid);

      return '<div class="grab"></div>'

  return '<div class="scrim" onclick="if(event.target===this)A.closeSheet()"><div class="sheet">'+inner+'</div></div>';

/* ================================================================
   ACTIONS — customer
   ================================================================ */
const A = {
  go(role){ S.role=role; S.stack=[]; S.sheet=null;
    if(role==='guest'){S.authed=false;S.tab='home';}
    if(role==='user'){S.authed=true;S.tab='home';}
    if(role==='rider'){S.tab=S.rider.tab||'dash';}
    if(role==='merchant'){S.tab=S.merchant.tab||'orders';}
    render();
  },
  setDevice(d){S.device=d;S.sheet=null;render();},
  setTab(t){S.tab=t;S.stack=[];S.sheet=null;if(S.role==='rider')S.rider.tab=t;if(S.role==='merchant')S.merchant.tab=t;render();},
  push(name,data){S.stack.push({name,data});render();
    if(name==='search'){setTimeout(()=>{const i=document.getElementById('searchInput');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}},60);}},
  pop(){S.stack.pop();render();},
  openSheet(n,d){S.sheet=n;S.sheetData=d;render();},
  closeSheet(){S.sheet=null;S.sheetData=null;render();},
  toast,
  setCat(c){S.restCat=c;render();},
  mapSel(id){S.mapSel=id;render();},
  gate(action){A.openSheet('gate',action);},
  openRest(id){A.push('restaurant',id);},
  doSearch(v){S.search=v;const r=document.getElementById('searchResults');if(r)r.innerHTML=searchResults();
    const si=document.getElementById('searchInput');},
  readAll(){S.notifs.forEach(n=>n.read=true);render();},
  togglePers(){S.personalization=!S.personalization;toast(S.personalization?'Recommendations on':'Recommendations off','zap');render();},

  /* ---- auth ---- */
  doAuth(mode){
    const name=(document.getElementById('authName')||{}).value;
    const email=(document.getElementById('authEmail')||{}).value;
    if(name)S.user.name=name;
    if(email&&email.includes('@'))S.user.email=email;
    S.authed=true; S.role='user'; S.tab='home'; S.stack=[]; S.sheet=null;
    S.notifs.unshift({id:'n'+(++SEQ),type:'system',title:mode==='signup'?'Welcome to MFF, '+S.user.name.split(' ')[0]+'! 🎉':'Welcome back!',msg:'Your account is ready — happy eating.',time:'now',read:false});
    toast(mode==='signup'?'Account created 🎉':'Logged in'); render();
  },
  logout(){S.authed=false;S.role='guest';S.tab='home';S.stack=[];S.cart={rid:null,items:[]};toast('Logged out');render();},

  /* ---- cart ---- */
  addDish(dishId){
    if(!S.authed){A.gate('add items & place orders');return;}
    const d=DISHES.find(x=>x.id===dishId);
    if(S.cart.rid && S.cart.rid!==d.rid && S.cart.items.length){
      if(!confirm('Start a new cart from '+rest(d.rid).name+'? Your current cart will be cleared.'))return;
      S.cart={rid:null,items:[]};
    }
    S.cart.rid=d.rid;
    const it=S.cart.items.find(i=>i.dishId===dishId);
    if(it)it.qty++; else S.cart.items.push({dishId:d.id,name:d.name,price:d.price,qty:1});
    render();
  },
  dec(dishId){
    const it=S.cart.items.find(i=>i.dishId===dishId);
    if(!it)return;
    it.qty--; if(it.qty<=0)S.cart.items=S.cart.items.filter(i=>i!==it);
    if(!S.cart.items.length)S.cart.rid=null;
    render();
  },
  pickSize(btn,n){btn.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));btn.classList.add('active');A._size=n;},
  star(btn,n){btn.parentElement.querySelectorAll('.iconbtn').forEach((b,i)=>b.style.color=i<n?'var(--amber)':'var(--line)');A._stars=n;},

  /* ---- reservations ---- */
  doReserve(rid){
    if(!S.authed){A.gate('reserve tables');return;}
    const r=rest(rid);
    const when=(document.getElementById('rsDate')||{}).value+' · '+((document.getElementById('rsTime')||{}).value||'7:30 PM');
    const res={id:'res'+(++SEQ),restId:rid,restName:r.name,cust:S.user.name,size:A._size||2,when,notes:(document.getElementById('rsNotes')||{}).value,status:'pending'};
    S.reservations.unshift(res);
    S.merchant.seedRes.unshift({id:res.id,cust:res.cust,size:res.size,when:res.when,notes:res.notes,status:'pending'});
    A.closeSheet();
    S.notifs.unshift({id:'n'+(++SEQ),type:'reservation',title:'Reservation requested 📅',msg:r.name+' · '+when+' · '+res.size+' guests',time:'now',read:false});
    toast('Request sent to '+r.name,'cal');
    // demo: auto-confirm after 9s if merchant doesn't act
    setTimeout(()=>{const rr=S.reservations.find(x=>x.id===res.id);if(rr&&rr.status==='pending'){merchantDecideRes(res.id,true);}},9000);
  },

  /* ---- feed ---- */
  like(pid){const p=S.feed.find(x=>x.id===pid);if(!p)return;p.liked=!p.liked;p.likes+=p.liked?1:-1;render();},
  doPost(){
    const txt=(document.getElementById('npText')||{}).value.trim();
    if(!txt){toast('Write something first','edit');return;}
    const rname=(document.getElementById('npRest')||{}).value;
    const r=RESTAURANTS.find(x=>x.name===rname)||RESTAURANTS[0];
    S.feed.unshift({id:'p'+(++SEQ),author:S.user.name,initial:S.user.name[0],color:'#EA5410',badge:'',time:'now',text:txt,rest:r.name,dish:'',rating:A._stars||5,photo:r.emoji,pbg:r.grad,likes:0,liked:false,comments:[]});
    A.closeSheet();toast('Posted to the feed 🎉','users');
    if(S.tab!=='feed')A.setTab('feed');else render();
  },
  doComment(pid){
    const inp=document.getElementById('cmtIn');const t=(inp||{}).value.trim();
    if(!t)return;
    const p=S.feed.find(x=>x.id===pid);p.comments.push({a:S.user.name,t});render();
  },

  /* ---- checkout / order lifecycle ---- */
  placeOrder(){
    const r=rest(S.cart.rid);
    const o={id:'o'+(++SEQ),orderNo:'MFF-'+String(SEQ).slice(-4),restId:r.id,restName:r.name,
      items:S.cart.items.map(i=>({name:i.name,qty:i.qty,price:i.price})),
      fee:r.fee,total:cartTotal()+r.fee,
      brgy:(document.getElementById('coBrgy')||{}).value||'Central (Poblacion)',
      addr:(document.getElementById('coAddr')||{}).value,
      status:'pending',placed:'just now'};
    S.orders.unshift(o);
    S.merchant.seedOrders.unshift({id:o.id,orderNo:o.orderNo,cust:S.user.name,items:o.items.map(i=>({name:i.name,qty:i.qty,price:i.price})),total:o.total-o.fee,fee:o.fee,status:'pending',placed:'just now',channel:'live'});
    S.cart={rid:null,items:[]};
    S.stack=[];
    S.notifs.unshift({id:'n'+(++SEQ),type:'order',title:'Order placed 🧾',msg:o.restName+' is reviewing your order.',time:'now',read:false});
    A.setTab('orders'); A.push('tracking',o.id);
    toast('Order sent to '+r.restName,'receipt');
    setTimeout(()=>merchantAutoAccept(o.id),8000);   // demo auto-flow if merchant idle
  }
};

/* ================================================================
   SHARED ORDER LIFECYCLE (customer ↔ merchant ↔ rider)
   ================================================================ */
function setOrderStatus(oid,status,riderName){
  const o=S.orders.find(x=>x.id===oid); if(o){o.status=status; if(riderName)o.rider=riderName;}
  const mo=S.merchant.seedOrders.find(x=>x.id===oid); if(mo)mo.status=status;
  const page=S.stack[S.stack.length-1];
  if(['user','guest','rider','merchant'].includes(S.role)) render();
}
function notify(type,title,msg){S.notifs.unshift({id:'n'+(++SEQ),type,title,msg,time:'now',read:false});}

function merchantAutoAccept(oid){
  const mo=S.merchant.seedOrders.find(x=>x.id===oid);
  if(!mo||mo.status!=='pending')return;
  merchantAccept(oid,true);
}
function merchantAccept(oid,auto){
  const mo=S.merchant.seedOrders.find(x=>x.id===oid); if(!mo||mo.status!=='pending')return;
  mo.status='preparing'; setOrderStatus(oid,'preparing');
  notify('order','Order confirmed ✅',(mo.rest||'The store')+' is preparing your food.');
  if(!auto)toast('Order accepted — preparing','checkC'); else if(S.role==='user')toast('Store accepted your order','receipt');
  setTimeout(()=>merchantReady(oid), 9000);
}
function merchantReady(oid){
  const mo=S.merchant.seedOrders.find(x=>x.id===oid); if(!mo||mo.status!=='preparing')return;
  mo.status='ready'; setOrderStatus(oid,'ready');
  // dispatch to riders
  const o=S.orders.find(x=>x.id===oid);
  const restName=o?o.restName:'Store';
  const drop=o?('Brgy. '+o.brgy):'Brgy. Central';
  S.rider.reqs.unshift({id:'req'+(++SEQ),oid,orderNo:mo.orderNo,rest:restName,drop,items:mo.items.map(i=>i.qty+'× '+i.name).join(', '),total:mo.total+mo.fee,fee:mo.fee+16,dist:'2.4 km'});
  notify('order','Ready for pickup 📦','Looking for a rider near you…');
  if(S.role==='merchant'&&S.device==='app')toast('Marked ready — rider requested','bike');
  render();
  setTimeout(()=>riderAutoDispatch(oid), 8000);
}
function riderAutoDispatch(oid){
  const q=S.rider.reqs.find(x=>x.oid===oid); if(!q)return;
  S.rider.reqs=S.rider.reqs.filter(x=>x!==q);
  setOrderStatus(oid,'on_the_way','Jomer C.');
  notify('order','Rider on the way 🛵','Jomer C. picked up your order.');
  if(S.role==='user')toast('Rider picked up your order 🛵','bike');
  setTimeout(()=>{ setOrderStatus(oid,'delivered'); notify('order','Delivered 🎉','Enjoy your meal! Rate your experience.'); if(S.role==='user')toast('Order delivered 🎉','checkC'); },11000);
}
function merchantDecideRes(resId,approve){
  const mr=S.merchant.seedRes.find(x=>x.id===resId);
  const ur=S.reservations.find(x=>x.id===resId);
  if(mr)mr.status=approve?'confirmed':'declined';
  if(ur)ur.status=approve?'confirmed':'declined';
  notify('reservation',approve?'Reservation confirmed 🎉':'Reservation declined',
    (ur?ur.restName:'Store')+' · '+(ur?ur.when:''));
  if(S.role==='merchant')toast(approve?'Reservation confirmed':'Reservation declined',approve?'checkC':'x');
  else if(S.role==='user')toast(approve?'Table confirmed 🎉':'Store declined the request',approve?'cal':'x');
  render();
}
Object.assign(A,{
  toggleOnline(){S.rider.online=!S.rider.online;toast(S.rider.online?'You\'re online — receiving requests':'You\'re offline','bike');render();},
  riderSkip(id){S.rider.reqs=S.rider.reqs.filter(q=>q.id!==id);toast('Skipped');render();},
  riderAccept(id){
    const q=S.rider.reqs.find(x=>x.id===id); if(!q)return;
    S.rider.reqs=S.rider.reqs.filter(x=>x!==q);
    S.rider.active={...q,step:'pickup'};
    if(q.oid)setOrderStatus(q.oid,'on_the_way','Jomer C.');
    toast('Delivery accepted','bike');render();
  },
  riderNext(){
    const a=S.rider.active; if(!a)return;
    if(a.step==='pickup'){a.step='picked';toast('Order picked up','bag');}
    else if(a.step==='picked'){a.step='deliver';toast('On the way to customer','nav');}
    else{
      if(a.oid)setOrderStatus(a.oid,'delivered');
      S.rider.today++;S.rider.pay+=a.fee;S.rider.week[6].v+=a.fee;
      S.rider.active=null;toast('Delivered — '+peso(a.fee)+' earned 💵','dollar');
      notify('order','Delivered 🎉','Enjoy your meal! Rate your experience.');
    }
    render();
  }
});

      ? S.admin.flags.map(f=>'<div class="panel" style="margin-bottom:12px"><div class="p-body">'
        +'<div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:10px">'
        +'  <div class="row"><span class="badge red">'+ic('flag',11)+' '+f.reason+'</span><span class="tiny dim">'+f.reports+' reports</span></div>'
        +'  <div class="row" style="gap:8px"><button class="btn ghost sm" onclick="A.resolveFlag(\''+f.id+'\',false)">Keep post</button>'
        +'    <button class="btn danger sm" onclick="A.resolveFlag(\''+f.id+'\',true)">'+ic('trash',13)+' Remove post</button></div></div>'
        +'<hr class="divider" style="margin:12px 0">'
        +'<div class="small"><b>'+f.post+'</b> · '+f.by+'</div><div class="small muted" style="margin-top:4px">'+f.excerpt+'</div>'
        +'</div></div>').join('')
      :'<div class="panel"><div class="empty"><div class="eicon">🛡️</div><div class="h3">Queue clear</div><div class="small muted">No flagged content.</div></div></div>');
  },
  subs(){
    return '<div class="web-head"><div><div class="h1">Subscriptions</div><div class="small muted">Store billing via PayMongo.</div></div></div>'
    +'<div class="kpis">'
    +[['💳','MRR','₱9,482',''],['✅','Active paid','19',''],['🎁','On trial','5',''],['⚠️','Past due','1','']]
     .map(k=>'<div class="kpi"><div class="k-label">'+k[0]+' '+k[1]+'</div><div class="k-val" style="font-size:20px">'+k[2]+'</div></div>').join('')
    +'</div>'
    +'<div class="panel"><table class="table"><tr><th>Store</th><th>Plan</th><th>Next billing</th><th>Status</th><th style="text-align:right">Actions</th></tr>'
    + S.admin.subs.map(s=>'<tr><td class="bold">'+s.store+'</td><td class="small muted">'+s.plan+'</td><td class="small muted">'+s.renew+'</td>'
      +'<td><span class="badge '+(s.status==='active'?'green':s.status==='trial'?'amber':'red')+'">'+s.status.replace('_',' ')+'</span></td>'
      +'<td style="text-align:right">'+(s.status==='past_due'
        ?'<button class="btn primary sm" onclick="A.toast(\'Reminder sent via email\',\'send\')">Send reminder</button>'
        :'<button class="btn ghost sm" onclick="A.toast(\'Invoice — demo\',\'fileText\')">Invoice</button>')+'</td></tr>').join('')
    +'</table></div>';
  }
};
Object.assign(A,{
  admin(p){S.admin.page=p;render();},
  decideStore(id,ok){
    const a=S.admin.approvals.find(x=>x.id===id);
    S.admin.approvals=S.admin.approvals.filter(x=>x.id!==id);
    toast(ok?'"'+a.name+'" approved & live 🎉':'Application rejected',ok?'checkC':'x');render();
  },
  resolveFlag(id,remove){
    S.admin.flags=S.admin.flags.filter(f=>f.id!==id);
    toast(remove?'Post removed, author notified':'Report dismissed — post kept',remove?'trash':'checkC');render();
  }
});
